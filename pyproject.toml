[project]
name = "customer-support"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic-settings",
    "python-dotenv",
    "langchain",
    "langchain-core",
    "langchain-groq",
    "langchain-text-splitters",
    "mem0ai",
    "chromadb",
    "streamlit",
    "requests",
    "email-validator",
    "google-genai",

]

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["customer__support_agent"]
